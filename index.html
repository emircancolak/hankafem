<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Han Kafem — QR Menü</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ─── STICKY HEADER ─── -->
  <header id="site-header">
    <div class="hdr-inner">
      <div class="hdr-logo">
        <img src="hankafemlogo.png" alt="Han Kafem" id="hdr-logo-img">
      </div>
      <div class="hdr-brand">
        <span class="hdr-brand-name">HAN KAFEM</span>
        <span class="hdr-brand-sub">MANİSA</span>
      </div>
      <a href="https://instagram.com/hankafem" class="hdr-ig" target="_blank" rel="noopener" aria-label="Instagram">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
        <span>hankafem</span>
      </a>
    </div>
  </header>

  <!-- ─── HERO (Video Background) ─── -->
  <section id="hero">
    <!-- Video arkaplan -->
    <video
      id="hero-video"
      class="hero-video"
      src="images/cilve3.mp4"
      poster="cilveli-kahve.jpg"
      autoplay
      loop
      muted
      playsinline
      preload="auto"
      aria-hidden="true"
    ></video>

    <!-- Overlay katmanları -->
    <div class="hero-overlay"></div>
    <div class="hero-overlay-grid"></div>
    <div class="hero-glow-left"></div>
    <div class="hero-glow-right"></div>

    <!-- Hero text -->
    <div class="hero-text-block">
      <p class="hero-eyebrow">ÖZEL TARİF</p>
      <h2 class="hero-title">Cilveli Kahvemizi<br><em>Denediniz mi?</em></h2>
      <p class="hero-sub">Fındıklı, kadifemsi, eşsiz bir deneyim.</p>
      <div class="hero-divider">
        <span></span><span class="hero-divider-gem">◆</span><span></span>
      </div>
    </div>
  </section>

  <!-- ─── SEARCH BAR ─── -->
  <div id="search-bar-wrap">
    <div class="search-bar-inner">
      <div class="search-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </div>
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Menüde ara…"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      />
      <button id="search-clear" class="search-clear" aria-label="Aramayı temizle" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ─── CATEGORY TABS ─── -->
  <nav id="cat-nav" aria-label="Kategori filtresi">
    <div class="cat-nav-inner" id="cat-nav-inner">
      <!-- JS ile doldurulacak -->
    </div>
  </nav>

  <!-- ─── MENU ─── -->
  <main id="menu-main">
    <div id="menu-root">
      <div class="lux-loading" aria-live="polite">
        <div class="lux-spinner"></div>
        <p>Menü hazırlanıyor…</p>
      </div>
    </div>

    <!-- Alıntı notu -->
    <div class="closing-note" id="closing-note">
      <div class="closing-note-inner">
        <div class="cn-ornament">✦ ✦ ✦</div>
        <p class="cn-text">Afiyet Olsun</p>
        <p class="cn-author">— Han Kafem</p>
      </div>
    </div>
  </main>

  <!-- ─── FOOTER ─── -->
  <footer id="site-footer">
    <a href="https://instagram.com/hankafem" class="footer-ig" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
      <span>hankafem</span>
    </a>
  </footer>

  <!-- ─── SCROLL TO TOP ─── -->
  <button id="scroll-top-btn" class="scroll-top-btn" aria-label="Yukarı çık" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <!-- ─── LIGHTBOX MODAL ─── -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Ürün detayı" hidden>
    <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
    <div class="lightbox-panel">
      <button class="lightbox-close" id="lightbox-close" aria-label="Kapat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div class="lightbox-img-wrap" id="lightbox-img-wrap">
        <!-- dinamik -->
      </div>
      <div class="lightbox-body">
        <p class="lightbox-badge-line" id="lightbox-badge-line"></p>
        <h3 class="lightbox-name" id="lightbox-name"></h3>
        <p class="lightbox-desc" id="lightbox-desc"></p>
        <div class="lightbox-price-row">
          <span class="lightbox-price" id="lightbox-price"></span>
          <span class="lightbox-price-suffix">₺</span>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
